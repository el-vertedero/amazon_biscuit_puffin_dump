/*  
    Parametric EQ Configuration EQv5.4
    options for FilterType : LOW_PASS, HIGH_PASS, BAND_PASS, NOTCH, PEAK, LOW_SHELF, HIGH_SHELF, BYPASS
    Fc : Cutoff/Center Frequency in Hertz
    Q:   Quality Factor
    GaindB: Gain in dB

*/

{
    "Bypass"            : false,
    "NumBiquads"        : 4,   // MUST be a multiple of 4

    "Biquad Definitions":
    [
        // Biquad 1. High pass filter to attenuate frequencies below 100 Hz by 30 dB
        {
            "FilterType" : "HIGH_PASS",
            "Fc"         : 100,
            "Q"          : 0.5,
            "GaindB"     : -30.0
        },
        // Biquad 2. Low shelf to cut frequencies less than 650 Hz by 3 dB
        {
            "FilterType" : "LOW_SHELF",
            "Fc"         : 650,
            "Q"          : 0.5,
            "GaindB"     : -3.0
        },
        // Biquad 3. Low shelf to cut frequencies less than 1000 Hz by 3 dB
        {
            "FilterType" : "LOW_SHELF",
            "Fc"         : 1000,
            "Q"          : 0.5,
            "GaindB"     : -3.0
        },
        // Biquad 4.  High shelf to boost frequencies more than 6000 Hz by 6 dB
        {
            "FilterType" : "HIGH_SHELF",
            "Fc"         : 6000,
            "Q"          : 0.5,
            "GaindB"     : 6.0
        }
   ]
}
